# MaterialScope packaging contract (introduced in PR-3).
#
# Runtime dependencies intentionally live in requirements.txt, which this
# file consumes dynamically (tool.setuptools.dynamic.dependencies). Docker
# installs that same file directly, so there is exactly one runtime
# dependency source. Development/test tooling is isolated in the `dev`
# extra and must never be added to requirements.txt.
#
# MaterialScope runs from a repository checkout (see docker/start.sh);
# the packages below are declared so editable installs provide real,
# importable modules, not just dependency metadata.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "MaterialScope"
description = "Open-source Python workbench for reproducible materials-characterization workflows (DSC, TGA, DTA, FTIR, Raman, XRD)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Utku Şahin" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/utkuvibing/MaterialScope"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff",
]

[tool.setuptools.packages.find]
include = [
    "backend*",
    "core*",
    "dash_app*",
    "landing*",
    "ui*",
    "utils*",
]

[tool.setuptools.package-data]
landing = ["web/*"]

# Version mirrors the application version convention (utils/license_manager.py
# APP_VERSION, also used by the Windows installer build). No separate release
# scheme exists; setuptools reads the constant statically.
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
version = { attr = "utils.license_manager.APP_VERSION" }
